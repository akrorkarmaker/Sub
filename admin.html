<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1020">
<title>অ্যাডমিন প্যানেল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--s1:#121a2e;--s2:#182341;--ln:#26335a;--tx:#f2f5fb;--mu:#98a3bc;--rd:#ff3b3b;--ok:#2ed3a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Hind Siliguri",system-ui,sans-serif;padding:24px 18px 48px}
main{max-width:520px;margin:0 auto}
h1{font-size:26px;font-weight:700;margin:6px 0 4px}h2{font-size:17px;font-weight:600;margin:0 0 12px}
.sub{color:var(--mu);margin:0 0 22px;font-size:15px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:20px;margin-bottom:16px}
label{display:block;font-size:14px;font-weight:500;color:var(--mu);margin:14px 0 6px}label:first-of-type{margin-top:0}
input[type=text],input[type=url],input[type=password]{width:100%;padding:13px 14px;background:var(--s2);border:1px solid var(--ln);border-radius:12px;color:var(--tx);font:inherit;outline:0}
input:focus{border-color:var(--rd)}
.tg{display:flex;gap:12px;align-items:center;margin-top:16px;background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.tg input{width:20px;height:20px;accent-color:var(--rd);flex:none}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;font:600 16px "Hind Siliguri",sans-serif;cursor:pointer;margin-top:14px}
.pri{background:var(--rd);color:#fff}.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.out{word-break:break-all;background:var(--s2);border:1px dashed var(--ln);border-radius:12px;padding:12px;font-size:13px;color:var(--ok);margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hi{padding:14px 0;border-bottom:1px solid var(--ln)}.hi:last-child{border:0;padding-bottom:0}
.hi b{display:block;font-weight:600}.hi small{color:var(--mu);font-size:13px}
.hi .two{margin-top:8px}.hi .btn{margin:0;padding:10px;font-size:14px;border-radius:10px}
.hide{display:none!important}.err{color:#ff6b6b;font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<main>
<div id="lg">
  <h1>অ্যাডমিন লগইন</h1>
  <p class="sub">শুধু আপনার জন্য। ইমেইল ও পাসওয়ার্ড দিন।</p>
  <div class="card"><label>ইমেইল</label><input type="text" id="em" autocomplete="username"><label>পাসওয়ার্ড</label><input type="password" id="pw" autocomplete="current-password">
  <button class="btn pri" id="in">ঢুকুন</button><p class="err hide" id="er">ইমেইল বা পাসওয়ার্ড ভুল</p></div>
</div>

<div id="pn" class="hide">
  <h1>অ্যাডমিন প্যানেল</h1>
  <p class="sub">ভিডিও প্রতি একটি করে ভেরিফিকেশন লিংক বানান।</p>
  <div class="card">
    <h2>নতুন লিংক</h2>
    <label>আপনার চ্যানেলের নাম (ইউটিউবে যেভাবে দেখা যায়)</label><input type="text" id="ch" placeholder="যেমন: Mobin IQ">
    <label>ভিডিওর ইউটিউব URL</label><input type="url" id="v" placeholder="https://youtu.be/...">
    <label>আনলক হলে যে লিংক দেখাবে</label><input type="url" id="l" placeholder="https://...">
    <label>পেজের শিরোনাম</label><input type="text" id="t" placeholder="যেমন: ফ্রি টুল পেতে যাচাই করুন">
    <label class="tg"><input type="checkbox" id="c" checked><span>স্ক্রিনশটে ফোনের ঘড়ি এখনকার সময়ের ১-২ মিনিটের মধ্যে থাকতে হবে</span></label>
    <button class="btn pri" id="go">লিংক তৈরি করুন</button>
    <p class="err hide" id="e2"></p>
    <div id="res" class="hide"><div class="out" id="url"></div>
      <div class="two"><button class="btn ghost" id="cp">কপি করুন</button><a class="btn ghost" id="op" target="_blank" rel="noopener">পরীক্ষা করুন</a></div></div>
  </div>
  <div class="card"><h2>আগের লিংকগুলো</h2><div id="hs"></div></div>
  <button class="btn ghost" id="out">লগআউট</button>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBp2ZzTfXeGsMf-OFpXGidzO6FbzJceQtU",authDomain:"subscribedpro.firebaseapp.com",projectId:"subscribedpro",storageBucket:"subscribedpro.firebasestorage.app",messagingSenderId:"191293333785",appId:"1:191293333785:web:b5822d21fa81fbdd6fa588"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base=location.origin+location.pathname.replace(/[^/]*$/,'')+'index.html';
const urlOf=id=>base+'?id='+id;
auth.onAuthStateChanged(u=>{$('#lg').classList.toggle('hide',!!u);$('#pn').classList.toggle('hide',!u);if(u)hist()});
$('#in').onclick=async()=>{$('#er').classList.add('hide');try{await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(e){$('#er').classList.remove('hide')}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#in').click()};
$('#out').onclick=()=>auth.signOut();
$('#go').onclick=async()=>{
  const o={ch:$('#ch').value.trim(),v:$('#v').value.trim(),l:$('#l').value.trim(),t:$('#t').value.trim(),c:$('#c').checked?1:0},e=$('#e2'),b=$('#go');
  if(!o.ch||!o.l){e.textContent='চ্যানেলের নাম ও আনলক লিংক অবশ্যই দিন।';e.classList.remove('hide');return}
  e.classList.add('hide');b.disabled=true;
  try{
    const r=await db.collection('links').add({...o,createdAt:Date.now()}),u=urlOf(r.id);
    $('#res').classList.remove('hide');$('#url').textContent=u;$('#op').href=u;$('#cp').textContent='কপি করুন';
    $('#cp').onclick=()=>navigator.clipboard.writeText(u).then(()=>{$('#cp').textContent='কপি হয়েছে'});
    hist();
  }catch(x){e.textContent='সেভ হয়নি। Firestore Rules ও ইন্টারনেট পরীক্ষা করুন।';e.classList.remove('hide')}
  b.disabled=false;
};
async function hist(){
  const box=$('#hs');
  try{
    const sn=await db.collection('links').orderBy('createdAt','desc').limit(30).get();
    box.innerHTML=sn.empty?'<p class="sub" style="margin:0">এখনো কোনো লিংক বানানো হয়নি।</p>':sn.docs.map(d=>{const x=d.data();return `<div class="hi"><b>${esc(x.t||x.ch)}</b><small>${esc(x.v||'ভিডিও লিংক নেই')}</small><div class="two"><button class="btn ghost" data-c="${d.id}">কপি</button><button class="btn ghost" data-d="${d.id}">মুছুন</button></div></div>`}).join('');
    box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(urlOf(b.dataset.c)).then(()=>{b.textContent='কপি হয়েছে'}));
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('এই লিংকটি মুছবেন?')){await db.collection('links').doc(b.dataset.d).delete();hist()}});
  }catch(e){box.innerHTML='<p class="err">তালিকা লোড হয়নি। Rules ঠিক আছে কি না দেখুন।</p>'}
}
</script>
</body>
</html>
