<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1020">
<title>সাবস্ক্রাইব ভেরিফিকেশন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--s1:#121a2e;--s2:#182341;--ln:#26335a;--tx:#f2f5fb;--mu:#98a3bc;--rd:#ff3b3b;--ok:#2ed3a0;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Hind Siliguri",system-ui,sans-serif;padding:24px 18px 48px}
main{max-width:460px;margin:0 auto}
.ring{width:96px;height:96px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center;margin:12px auto 22px;color:var(--rd);box-shadow:0 0 0 9px rgba(255,59,59,.08);transition:.5s}
.ring.ok{color:var(--ok);box-shadow:0 0 0 9px rgba(46,211,160,.12)}
.sh{transition:transform .5s;transform-origin:16px 11px}.open .sh{transform:translate(1px,-3px) rotate(-14deg)}
h1{font-size:28px;line-height:1.3;font-weight:700;text-align:center;margin:0 0 8px}
.sub{color:var(--mu);text-align:center;margin:0 0 26px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:20px;margin-bottom:14px;transition:.3s}
.card.dim{opacity:.4;pointer-events:none}
.hd{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--s2);border:1px solid var(--ln);display:grid;place-items:center;font-weight:600}
.hd h2{font-size:18px;font-weight:600;margin:0;line-height:1.4}
.hd p{margin:2px 0 0;color:var(--mu);font-size:14px;line-height:1.5}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;font:600 16px "Hind Siliguri",sans-serif;cursor:pointer;margin-top:10px}
.pri{background:var(--rd);color:#fff}.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.good{background:var(--ok);color:#06241b}
.hide{display:none!important}
.drop{display:block;border:1.5px dashed var(--ln);border-radius:16px;padding:26px 14px;text-align:center;cursor:pointer;background:var(--s2)}
.drop svg{color:var(--mu)}.drop b{display:block;margin-top:6px}.drop span{font-size:13px;color:var(--mu);line-height:1.5;display:block}
#pv{width:100%;height:170px;object-fit:cover;border-radius:14px;margin-top:12px;border:1px solid var(--ln)}
#bar{height:6px;background:var(--s2);border-radius:4px;overflow:hidden;margin-top:14px}
#bar i{display:block;height:100%;width:0;background:var(--rd);transition:width .25s}
#st{color:var(--mu);font-size:14px;margin:10px 0 0;text-align:center}
.chk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:15px}
.chk:last-child{border:0}.chk em{margin-left:auto;font-style:normal;font-weight:600;font-size:14px}
.y{color:var(--ok)}.n{color:var(--bad)}
.foot{color:var(--mu);font-size:13px;text-align:center;line-height:1.6;margin-top:18px}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBp2ZzTfXeGsMf-OFpXGidzO6FbzJceQtU",authDomain:"subscribedpro.firebaseapp.com",projectId:"subscribedpro",storageBucket:"subscribedpro.firebasestorage.app",messagingSenderId:"191293333785",appId:"1:191293333785:web:b5822d21fa81fbdd6fa588"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const $=s=>document.querySelector(s), app=$('#app');
const dec=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const lock=o=>`<div class="ring${o?' ok':''}"><svg class="${o?'open':''}" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path class="sh" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>`;
const d=new URLSearchParams(location.search).get('id'); let cfg=null;
const bad=m=>{app.innerHTML=lock(false)+'<h1>'+m+'</h1><p class="sub">যে লিংক থেকে এসেছেন সেটি আবার খুলুন।</p>'};
(async()=>{
  if(!d){bad('লিংকটি সঠিক নয়');return}
  app.innerHTML=lock(false)+'<p class="sub">লোড হচ্ছে...</p>';
  try{const sn=await db.collection('links').doc(d).get();
    if(!sn.exists||!sn.data().l){bad('লিংকটি সঠিক নয়');return}
    cfg=sn.data(); store.get('ok:'+d,false)?unlocked(cfg):view(cfg);
  }catch(e){bad('ইন্টারনেট সংযোগ পরীক্ষা করুন')}
})();

function unlocked(o){
  app.innerHTML=lock(true)+`<h1>যাচাই সম্পন্ন</h1><p class="sub">ধন্যবাদ, আপনি সাবস্ক্রাইব করেছেন। আপনার লিংক তৈরি।</p>
  <a class="btn good" href="${esc(o.l)}" target="_blank" rel="noopener">লিংক খুলুন</a>
  <p class="foot">এই ফোনে এই লিংকে আবার ঢুকলে সরাসরি খুলে যাবে।</p>`;
}

function view(o){
  const hasV=!!o.v;
  app.innerHTML=lock(false)+`<h1>${esc(o.t||'ফ্রি লিংক পেতে যাচাই করুন')}</h1>
  <p class="sub">${hasV?'দুটি ধাপ পার হলেই লিংক খুলে যাবে।':'একটি ধাপ পার হলেই লিংক খুলে যাবে।'}</p>
  ${hasV?`<section class="card" id="s1"><div class="hd"><span class="no">১</span><div><h2>ভিডিওতে কমেন্ট করুন</h2><p>ভিডিও খুলে একটি কমেন্ট লিখে এখানে ফিরে আসুন।</p></div></div>
    <a class="btn pri" id="ov" href="${esc(o.v)}" target="_blank" rel="noopener">ভিডিও খুলুন</a>
    <button class="btn ghost hide" id="d1">কমেন্ট করেছি, এগিয়ে যাই</button></section>`:''}
  <section class="card${hasV?' dim':''}" id="s2">
    <div class="hd"><span class="no">${hasV?'২':'১'}</span><div><h2>সাবস্ক্রাইবের প্রমাণ দিন</h2><p>ইউটিউব অ্যাপে <b>${esc(o.ch)}</b> চ্যানেলের পেজে Subscribed দেখা যায় এমন স্ক্রিনশট নিন। ফোনের উপরের ঘড়ি যেন স্ক্রিনশটে থাকে।</p></div></div>
    <input type="file" id="f" accept="image/*" class="hide">
    <label class="drop" for="f" id="dz"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><b>স্ক্রিনশট বেছে নিন</b><span>চ্যানেলের নাম, Subscribed ও ঘড়ি পরিষ্কার দেখা যেতে হবে</span></label>
    <img id="pv" class="hide" alt="">
    <div id="bar" class="hide"><i></i></div>
    <p id="st"></p><div id="res"></div>
  </section>
  <p class="foot">যাচাই আপনার ফোনেই হয়। ছবি কোথাও পাঠানো হয় না, শুধু ব্যবহারের একটি কোড জমা থাকে।</p>`;
  if(hasV){$('#ov').onclick=()=>setTimeout(()=>$('#d1').classList.remove('hide'),600);
    $('#d1').onclick=()=>{$('#s2').classList.remove('dim');$('#s1').classList.add('dim');$('#s2').scrollIntoView({behavior:'smooth'})}}
  $('#f').onchange=e=>e.target.files[0]&&verify(o,e.target.files[0]);
}

async function sha(f){const h=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9\u0980-\u09ff]/g,'');
function chanOK(text,name){const t=norm(text),w0=norm(name);if(w0&&t.includes(w0))return true;
  const w=name.toLowerCase().split(/\s+/).map(norm).filter(x=>x.length>=2);return w.length>1&&w.filter(x=>t.includes(x)).length/w.length>=.6}
function clockOK(text){const n=new Date(),m=n.getHours()*60+n.getMinutes(),re=/(\d{1,2})\s*[:.]\s*(\d{2})/g;let x;
  while((x=re.exec(text))){const h=+x[1],mi=+x[2];if(h>23||mi>59)continue;let df=Math.abs(((h%12)*60+mi)-(m%720));df=Math.min(df,720-df);if(df<=2)return true}return false}

async function verify(o,file){
  const st=$('#st'),bar=$('#bar'),fill=bar.firstElementChild,res=$('#res'),pv=$('#pv');
  pv.src=URL.createObjectURL(file);pv.classList.remove('hide');$('#dz').classList.add('hide');
  res.innerHTML='';bar.classList.remove('hide');
  try{
    st.textContent='ছবি পরীক্ষা হচ্ছে...';
    const hash=(await sha(file))+'_'+d,uref=db.collection('used').doc(hash);
    if((await uref.get()).exists)throw new Error('এই স্ক্রিনশটটি আগেই ব্যবহার করা হয়েছে। নতুন স্ক্রিনশট নিন।');
    st.textContent='প্রথমবার একটু সময় লাগবে, অপেক্ষা করুন...';
    const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.progress!=null)fill.style.width=Math.round(m.progress*100)+'%'}});
    const bmp=await createImageBitmap(file);
    st.textContent='লেখা পড়া হচ্ছে...';
    const full=(await w.recognize(file)).data.text;let strip='';
    if(o.c){const c=document.createElement('canvas'),h=Math.round(bmp.height*.07),s=2;c.width=bmp.width*s;c.height=h*s;
      const g=c.getContext('2d');g.filter='grayscale(1) contrast(1.4)';g.drawImage(bmp,0,0,bmp.width,h,0,0,c.width,c.height);
      await w.setParameters({tessedit_pageseg_mode:'11',tessedit_char_whitelist:'0123456789:. APMapm'});strip=(await w.recognize(c)).data.text}
    await w.terminate();
    const r=[['চ্যানেলের নাম',chanOK(full,o.ch)],['Subscribed লেখা',/\bsubscribed\b/i.test(full)||/সাবস্ক্রাইব(ড| করা)/.test(full)]];
    if(o.c)r.push(['ফোনের ঘড়ি',clockOK(strip)||clockOK(full.split('\n').slice(0,4).join(' '))]);
    const ic=b=>b?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    res.innerHTML=r.map(([a,b])=>`<div class="chk"><span class="${b?'y':'n'}">${ic(b)}</span>${a}<em class="${b?'y':'n'}">${b?'মিলেছে':'মেলেনি'}</em></div>`).join('');
    if(r.every(x=>x[1])){await uref.set({t:Date.now()});store.set('ok:'+d,true);setTimeout(()=>unlocked(o),1200);st.textContent='যাচাই সফল...'}
    else{st.textContent='যাচাই হয়নি। চ্যানেলের নাম, Subscribed ও উপরের ঘড়ি পরিষ্কার দেখা যায় কি না দেখে আবার চেষ্টা করুন।';retry()}
  }catch(e){st.textContent=e.message||'কিছু ভুল হয়েছে, আবার চেষ্টা করুন।';retry()}
  bar.classList.add('hide');fill.style.width='0';
}
function retry(){$('#dz').classList.remove('hide');$('#dz').querySelector('b').textContent='আরেকটি স্ক্রিনশট দিন';$('#f').value=''}
</script>
</body>
</html>
