<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9eefb">
<title>সাবস্ক্রাইব যাচাই</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eefb;--ink:#1c1c1e;--mu:rgba(60,60,67,.62);--glass:rgba(255,255,255,.58);--gb:rgba(255,255,255,.8);--blue:#0a84ff;--ok:#30d158;--bad:#ff453a;--dash:rgba(60,60,67,.28);--fld:rgba(255,255,255,.4)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d17;--ink:#f5f5f7;--mu:rgba(235,235,245,.62);--glass:rgba(38,40,58,.55);--gb:rgba(255,255,255,.14);--dash:rgba(235,235,245,.3);--fld:rgba(255,255,255,.06)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hind Siliguri",system-ui,sans-serif;padding:max(28px,env(safe-area-inset-top)) 18px max(48px,env(safe-area-inset-bottom));overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.bg i:nth-child(1){width:300px;height:300px;background:#7aa7ff;top:-80px;left:-90px}
.bg i:nth-child(2){width:280px;height:280px;background:#c79bff;top:30%;right:-110px}
.bg i:nth-child(3){width:260px;height:260px;background:#ff9fbd;bottom:-70px;left:10%}
.bg i:nth-child(4){width:200px;height:200px;background:#8ef0d2;bottom:25%;left:-80px;opacity:.5}
@media(prefers-color-scheme:dark){.bg i{opacity:.4}}
@media(prefers-reduced-motion:no-preference){.bg i{animation:fl 14s ease-in-out infinite alternate}.bg i:nth-child(2){animation-duration:18s}.bg i:nth-child(3){animation-duration:16s}}
@keyframes fl{to{transform:translate(30px,-24px) scale(1.08)}}
main{max-width:440px;margin:0 auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--gb);box-shadow:0 10px 36px rgba(40,50,120,.12),inset 0 1px 0 rgba(255,255,255,.55)}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin:10px auto 20px;color:var(--blue);transition:.5s}
.ring.ok{color:var(--ok)}
.sh{transition:transform .5s;transform-origin:16px 11px}.open .sh{transform:translate(1px,-3px) rotate(-14deg)}
h1{font-size:28px;line-height:1.3;font-weight:700;text-align:center;margin:0 0 6px;letter-spacing:-.2px}
.sub{color:var(--mu);text-align:center;margin:0 0 24px;font-size:16px}
.card{border-radius:26px;padding:20px;margin-bottom:14px;transition:opacity .3s}
.card.dim{opacity:.45;pointer-events:none}
.hd{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.no{flex:none;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px}
.hd h2{font-size:18px;font-weight:600;margin:0;line-height:1.4}
.hd p{margin:2px 0 0;color:var(--mu);font-size:14.5px;line-height:1.55}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:999px;padding:15px;font:600 16.5px -apple-system,"Hind Siliguri",sans-serif;cursor:pointer;margin-top:10px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.pri{background:var(--blue);color:#fff}.sec{background:var(--fld);color:var(--blue);border:1px solid var(--gb)}.good{background:var(--ok);color:#06240f}
.hide{display:none!important}
.drop{display:block;border:1.5px dashed var(--dash);border-radius:22px;padding:28px 14px;text-align:center;cursor:pointer;background:var(--fld)}
.drop svg{color:var(--blue)}.drop b{display:block;margin-top:6px;font-weight:600}.drop span{font-size:13.5px;color:var(--mu)}
.pv{position:relative;border-radius:20px;overflow:hidden;height:210px;border:1px solid var(--gb)}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.scan{position:absolute;left:0;right:0;top:0;height:3px;background:var(--blue);box-shadow:0 0 18px 4px rgba(10,132,255,.7)}
@media(prefers-reduced-motion:no-preference){.scan{animation:sc 1.6s ease-in-out infinite alternate}}
@keyframes sc{from{top:0}to{top:calc(100% - 3px)}}
.stt{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 4px;font-weight:500}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--blue);opacity:.3}
@media(prefers-reduced-motion:no-preference){.dots i{animation:db 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}}
@keyframes db{50%{opacity:1;transform:translateY(-3px)}}
.err{display:flex;gap:10px;align-items:flex-start;background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.35);color:var(--bad);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14.5px;line-height:1.5}
.okc{animation:pop .5s}@keyframes pop{from{transform:scale(.6);opacity:0}}
.logo{position:relative;width:104px;height:104px;margin:10px auto 18px}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--gb);box-shadow:0 10px 30px rgba(40,50,120,.22);background:var(--glass)}
.tick{position:absolute;right:-2px;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;border:3px solid var(--bg)}
.vids{margin-top:28px}.vids h2{font-size:19px;font-weight:700;margin:0 4px 10px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.vc{position:relative;flex:none;width:138px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;scroll-snap-align:start;display:block;background:#2a2d3e;border:1px solid var(--gb);box-shadow:0 8px 24px rgba(40,50,120,.18)}
.vc img{width:100%;height:100%;object-fit:cover;display:block}
.nw{position:absolute;top:8px;left:8px;background:#ff453a;color:#fff;font:600 11px/1 -apple-system,BlinkMacSystemFont,sans-serif;padding:5px 9px;border-radius:999px}
.pl{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}
.foot{color:var(--mu);font-size:13px;text-align:center;line-height:1.6;margin-top:18px}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i><i></i></div>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBp2ZzTfXeGsMf-OFpXGidzO6FbzJceQtU",authDomain:"subscribedpro.firebaseapp.com",projectId:"subscribedpro",storageBucket:"subscribedpro.firebasestorage.app",messagingSenderId:"191293333785",appId:"1:191293333785:web:b5822d21fa81fbdd6fa588"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const lock=o=>`<div class="ring glass${o?' ok':''}"><svg class="${o?'open':''}" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path class="sh" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>`;
const d=new URLSearchParams(location.search).get('id'); let cfg=null;
const bad=m=>{app.innerHTML=lock(false)+'<h1>'+m+'</h1><p class="sub">যে লিংক থেকে এসেছেন সেটি আবার খুলুন।</p>'};
(async()=>{
  if(!d){bad('লিংকটি সঠিক নয়');return}
  app.innerHTML=lock(false)+'<p class="sub">লোড হচ্ছে...</p>';
  try{const sn=await db.collection('links').doc(d).get();
    if(!sn.exists||!sn.data().l){bad('লিংকটি সঠিক নয়');return}
    cfg=sn.data(); store.get('ok:'+d,false)?unlocked(cfg):view(cfg);
  }catch(e){bad('ইন্টারনেট সংযোগ পরীক্ষা করুন')}
})();

const LOGO='https://i.ibb.co/s9xWmGXG/Channel-profile-pic.jpg',LOGO2='https://i.ibb.co/TMjWvSNS/Channel-profile-pic.jpg';
const VIDS=['3ojXZqxuuAo','4236AEcK69U','BmUnO6qUt6k','6KXTZCHEnU0','lydTXf8n39k'];
function unlocked(o){
  app.innerHTML=`<div class="logo"><img src="${LOGO}" alt="${esc(o.ch)}" onerror="this.onerror=null;this.src='${LOGO2}'"><span class="tick okc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span></div>
  <h1>Verified</h1><p class="sub">Thanks for subscribing to ${esc(o.ch)}.</p>
  <a class="btn good" href="${esc(o.l)}" target="_blank" rel="noopener">${esc(o.bt||'Open Link')}</a>
  <section class="vids"><h2>Latest videos</h2><div class="rail">${VIDS.map((id,i)=>`<a class="vc" href="https://youtube.com/shorts/${id}" target="_blank" rel="noopener"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="">${i===0?'<span class="nw">Latest</span>':''}<span class="pl"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></a>`).join('')}</div></section>`;
}

function view(o){
  const hasV=!!o.v;
  app.innerHTML=lock(false)+`<h1>${esc(o.t||'ফ্রি লিংক পেতে যাচাই করুন')}</h1>
  <p class="sub">${hasV?'দুটি ধাপ পার হলেই আপনার লিংক খুলে যাবে।':'একটি ধাপ পার হলেই আপনার লিংক খুলে যাবে।'}</p>
  ${hasV?`<section class="card glass" id="s1"><div class="hd"><span class="no">১</span><div><h2>ভিডিওতে কমেন্ট করুন</h2><p>ভিডিও খুলে একটি কমেন্ট লিখে এখানে ফিরে আসুন।</p></div></div>
    <a class="btn pri" id="ov" href="${esc(o.v)}" target="_blank" rel="noopener">ভিডিও খুলুন</a>
    <button class="btn sec hide" id="d1">কমেন্ট করেছি, এগিয়ে যাই</button></section>`:''}
  <section class="card glass${hasV?' dim':''}" id="s2">
    <div class="hd"><span class="no">${hasV?'২':'১'}</span><div><h2>সাবস্ক্রাইব যাচাই করুন</h2><p>ইউটিউব অ্যাপে <b>${esc(o.ch)}</b> চ্যানেলের পেজ খুলে একটি পুরো স্ক্রিনশট নিন এবং এখানে দিন।</p></div></div>
    <input type="file" id="f" accept="image/*" class="hide">
    <label class="drop" for="f" id="dz"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><b>স্ক্রিনশট বেছে নিন</b><span>গ্যালারি থেকে ছবি দিন</span></label>
    <div id="sc" class="pv hide"><img id="pv" alt=""><div class="scan"></div></div>
    <div id="st" class="stt hide"><span>সাবস্ক্রাইব যাচাই হচ্ছে</span><span class="dots"><i></i><i></i><i></i></span></div>
    <div id="er" class="err hide"></div>
  </section>
  <p class="foot">যাচাই আপনার ফোনেই হয়। ছবি কোথাও পাঠানো হয় না।</p>`;
  if(hasV){$('#ov').onclick=()=>setTimeout(()=>$('#d1').classList.remove('hide'),600);
    $('#d1').onclick=()=>{$('#s2').classList.remove('dim');$('#s1').classList.add('dim');$('#s2').scrollIntoView({behavior:'smooth'})}}
  $('#f').onchange=e=>e.target.files[0]&&verify(o,e.target.files[0]);
}

async function sha(f){const h=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9\u0980-\u09ff]/g,'');
function chanOK(text,name){const t=norm(text),w0=norm(name);if(w0&&t.includes(w0))return true;
  const w=name.toLowerCase().split(/\s+/).map(norm).filter(x=>x.length>=2);return w.length>1&&w.filter(x=>t.includes(x)).length/w.length>=.6}
function userOK(text,un){const u=norm(String(un).replace('@',''));return !u||norm(text).includes(u)}
function clockOK(text){const n=new Date(),m=n.getHours()*60+n.getMinutes(),re=/(\d{1,2})\s*[:.]\s*(\d{2})/g;let x;
  while((x=re.exec(text))){const h=+x[1],mi=+x[2];if(h>23||mi>59)continue;let df=Math.abs(((h%12)*60+mi)-(m%720));df=Math.min(df,720-df);if(df<=2)return true}return false}

async function verify(o,file){
  const st=$('#st'),er=$('#er'),pv=$('#pv');
  pv.src=URL.createObjectURL(file);
  $('#dz').classList.add('hide');er.classList.add('hide');$('#sc').classList.remove('hide');st.classList.remove('hide');
  const fail=()=>{$('#sc').classList.add('hide');st.classList.add('hide');
    er.innerHTML='<span>যাচাই করা যায়নি। ইউটিউব অ্যাপে চ্যানেলের পেজের পরিষ্কার ও পুরো স্ক্রিনশট নিয়ে আবার চেষ্টা করুন।</span>';er.classList.remove('hide');
    $('#dz').classList.remove('hide');$('#dz').querySelector('b').textContent='আবার চেষ্টা করুন';$('#f').value=''};
  try{
    const hash=(await sha(file))+'_'+d,uref=db.collection('used').doc(hash);
    if((await uref.get()).exists)return fail();
    const w=await Tesseract.createWorker('eng',1);
    const bmp=await createImageBitmap(file);
    const full=(await w.recognize(file)).data.text;let strip='';
    if(o.c){const c=document.createElement('canvas'),h=Math.round(bmp.height*.07),s=2;c.width=bmp.width*s;c.height=h*s;
      const g=c.getContext('2d');g.filter='grayscale(1) contrast(1.4)';g.drawImage(bmp,0,0,bmp.width,h,0,0,c.width,c.height);
      await w.setParameters({tessedit_pageseg_mode:'11',tessedit_char_whitelist:'0123456789:. APMapm'});strip=(await w.recognize(c)).data.text}
    await w.terminate();
    const ok=chanOK(full,o.ch)&&userOK(full,o.un)&&(/\bsubscribed\b/i.test(full)||/সাবস্ক্রাইব(ড| করা)/.test(full))&&(!o.c||clockOK(strip)||clockOK(full.split('\n').slice(0,4).join(' ')));
    if(!ok)return fail();
    await uref.set({t:Date.now()});store.set('ok:'+d,true);
    st.innerHTML='<span class="okc" style="color:var(--ok)">যাচাই সফল</span>';$('.scan').style.display='none';
    setTimeout(()=>unlocked(o),900);
  }catch(e){fail()}
}
</script>
</body>
</html>
